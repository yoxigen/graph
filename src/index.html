<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Graph</title>
    <link type="text/css" rel="stylesheet" href="style/index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Yossi Kolesnicov" />
    <script type="module" src="scripts/main.ts"></script>
  </head>
  <body>
    <expandable-panel id="config_panel" legend="Config" noborder>
      <div id="controls_panel">
        <div>
          <label for="charge">Data</label>
          <select id="test_data"></select>
        </div>
        <h4>Graph</h4>
        <form id="graph_controls"></form>
        <h4>Render options</h4>
        <form id="render_controls"></form>
        <button id="reset_btn">Re-render</button>
        <button id="unfix_btn">Unfix nodes</button>
      </div>
    </expandable-panel>
    <article id="graph"></article>
  </body>
</html>
