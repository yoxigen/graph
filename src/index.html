<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Graph</title>
    <link type="text/css" rel="stylesheet" href="style/main.css" />
    <script type="module" src="scripts/main.ts"></script>
  </head>
  <body>
    <form id="controls">
      <div>
        <label for="charge">Data</label>
        <select id="test_data"></select>
      </div>
      <div>
        <label for="charge">Charge</label>
        <input type="range" id="charge" min="0" max="15000" step="50" />
        <span id="charge_value"></span>
      </div>
      <div>
        <label for="gravityForce">Gravity</label>
        <input type="range" id="gravityForce" min="0" max="0.1" step="0.001" />
        <span id="gravityForce_value"></span>
      </div>
    </form>
    <article id="graph"></article>
  </body>
</html>
